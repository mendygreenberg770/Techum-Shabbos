<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Techum motif: the squared city (green) inside its techum square (blue),
       with the home point in the middle. -->
  <rect width="512" height="512" rx="96" fill="#fafafa"/>
  <rect x="56" y="56" width="400" height="400" rx="28" fill="none"
        stroke="#1a5fb4" stroke-width="30"/>
  <rect x="166" y="166" width="180" height="180" rx="14" fill="#e8f6ee"
        stroke="#26a269" stroke-width="22"/>
  <circle cx="256" cy="256" r="34" fill="#e66100"/>
</svg>
